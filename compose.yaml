name: ${LOCAL_PROJECT:-distrito-hobby-ni}
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PORT: "4000"
      WEB_ORIGINS: ${WEB_ORIGINS:?Run pnpm local:setup}
      DATABASE_ENABLED: "true"
      DATABASE_URL: ${LOCAL_DATABASE_URL:?Run pnpm local:setup}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    networks: [supabase]
    stop_grace_period: 10s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [supabase]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 10s
networks:
  supabase:
    external: true
    name: ${LOCAL_NETWORK:?Run pnpm local:setup}
